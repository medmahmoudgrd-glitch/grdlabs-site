<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F7F5">
<title>Grdlabs Mobile</title>
<link rel="icon" href="../img/grdlabs-app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* Grdlabs Mobile UI prototype: login, employee account and company (owner) account, built from the "Grdlabs Mobile" design. */
  :root {
    color-scheme: light;
    --bg: #F7F7F5; --card: #FFFFFF; --tx: #1D1D1F; --sec: #6E6E73; --sep: #E6E6E3; --acc: #2F64C4; --onacc: #FFFFFF;
    --tint: #EEF3FB; --fill: #EEEEEC; --a: #9A5B13; --ab: #FBF3E6; --g: #2E7D4F; --gb: #E8F4EC; --r: #B3261E; --rb: #FBEAE8;
    --bar: rgba(247,247,245,.94); --desk: #E9E9E6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121214; --card: #1C1C1E; --tx: #F2F2F2; --sec: #A1A1A6; --sep: #2C2C2E; --acc: #7FA8F0; --onacc: #0E1A2E;
      --tint: #1E2A3D; --fill: #232326; --a: #F0B66A; --ab: #2E2416; --g: #7DD3A0; --gb: #16291E; --r: #F2948C; --rb: #34191A;
      --bar: rgba(18,18,20,.94); --desk: #08080A;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121214; --card: #1C1C1E; --tx: #F2F2F2; --sec: #A1A1A6; --sep: #2C2C2E; --acc: #7FA8F0; --onacc: #0E1A2E;
    --tint: #1E2A3D; --fill: #232326; --a: #F0B66A; --ab: #2E2416; --g: #7DD3A0; --gb: #16291E; --r: #F2948C; --rb: #34191A;
    --bar: rgba(18,18,20,.94); --desk: #08080A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--tx); font-family: -apple-system, 'SF Pro Text', 'SF Arabic', 'Noto Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--acc); text-decoration: none; cursor: pointer; }

  #phone { position: relative; width: 100%; height: 100dvh; background: var(--bg); overflow: hidden; }
  @media (min-width: 600px) and (min-height: 760px) {
    body { background: var(--desk); display: grid; place-items: center; }
    #phone { width: 390px; height: min(844px, calc(100dvh - 40px)); border-radius: 44px; box-shadow: 0 0 0 10px #1D1D1F, 0 30px 80px -20px rgba(0,0,0,.45); }
  }
  #scr { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(56px + env(safe-area-inset-top)) 20px 110px; display: flex; flex-direction: column; gap: 18px; }
  #scr.notabs { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  #scr.anim { animation: in .22s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }

  h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.35; }
  h2 { margin: 0; font-size: 17px; font-weight: 600; }
  p { margin: 0; }
  .card { background: var(--card); border-radius: 20px; overflow: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  .lbl { font-size: 13px; color: var(--sec); }
  .hd { font-size: 13px; color: var(--sec); margin: 0; padding: 0 20px 8px; }
  .sec { display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--g); display: inline-block; flex: none; }
  .pill { font-size: 12px; font-weight: 600; border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
  .warn { color: var(--a); background: var(--ab); } .ok { color: var(--g); background: var(--gb); } .bad { color: var(--r); background: var(--rb); }
  .btn { height: 52px; border: 0; border-radius: 16px; background: var(--acc); color: var(--onacc); font-size: 17px; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; }
  .btn2 { height: 52px; border: 0; border-radius: 16px; background: var(--tint); color: var(--acc); font-size: 16px; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; }
  .ghost { height: 48px; border: 0; background: none; font-size: 16px; color: var(--acc); width: 100%; }
  .btn:active, .btn2:active, .act:active, .row.tap:active { opacity: .7; }
  .ib { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--card); color: var(--tx); display: flex; align-items: center; justify-content: center; position: relative; padding: 0; flex: none; }
  .ib.acc { background: var(--acc); color: var(--onacc); }
  .ib .badge { position: absolute; top: 9px; left: 10px; width: 7px; height: 7px; border-radius: 4px; background: var(--acc); }

  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld label { font-size: 13px; color: var(--sec); padding: 0 4px; }
  .fld input, .fld select { height: 52px; border: 0; outline: 0; border-radius: 14px; background: var(--fill); padding: 0 16px; font-size: 16px; width: 100%; }
  .fld input:focus { box-shadow: 0 0 0 2px var(--acc) inset; }

  .row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 10px 20px; position: relative; width: 100%; border: 0; background: none; text-align: start; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 0; right: 20px; height: 1px; background: var(--sep); }
  .row .t { flex: 1; font-size: 16px; display: flex; flex-direction: column; min-width: 0; }
  .row .sub { font-size: 13px; color: var(--sec); margin-top: 2px; }
  .row .v { font-size: 16px; color: var(--sec); font-variant-numeric: tabular-nums; }
  .row .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .row .end .v { color: var(--tx); font-weight: 600; }
  .row input, .row select { border: 0; outline: 0; background: none; font-size: 16px; text-align: left; color: var(--sec); min-width: 0; flex: 1; }
  .row select { appearance: none; text-align: left; direction: rtl; flex: none; }
  .av { width: 40px; height: 40px; border-radius: 20px; background: var(--tint); color: var(--acc); display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
  .chev { color: var(--sec); flex: none; }

  .seg { display: flex; background: var(--fill); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; height: 36px; border: 0; border-radius: 9px; background: none; font-size: 14px; font-weight: 500; color: var(--tx); }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: var(--card); font-size: 14px; font-weight: 500; }
  .chip.on { background: var(--acc); color: var(--onacc); }
  .sw { width: 51px; height: 31px; border-radius: 16px; border: 0; background: var(--fill); position: relative; flex: none; transition: background .2s; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: right .2s; }
  .sw.on { background: var(--g); } .sw.on::after { right: 22px; }

  .tip { background: var(--tint); border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
  .tip .k { font-size: 12px; font-weight: 600; color: var(--acc); }
  .tip .m { font-size: 15px; font-weight: 500; margin-top: 3px; }
  .x { border: 0; background: none; color: var(--sec); padding: 4px; display: flex; }

  .mini { flex: 1; background: var(--card); border-radius: 20px; padding: 16px 18px; }
  .mini b { display: block; font-size: 20px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .act { flex: 1; border: 0; background: var(--card); border-radius: 18px; height: 76px; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; }
  .act svg { color: var(--acc); }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center; padding: 16px 12px; }
  .wd { font-size: 11px; color: var(--sec); padding-bottom: 6px; }
  .d { height: 38px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-variant-numeric: tabular-nums; position: relative; }
  .d::after { content: ""; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 3px; }
  .d.p::after { background: var(--g); } .d.l::after { background: var(--a); } .d.x::after { background: var(--r); }
  .d.o, .d.f { color: var(--sec); } .d.f { opacity: .55; }
  .d.t span { width: 34px; height: 34px; border-radius: 17px; background: var(--acc); color: var(--onacc); display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .stats { display: flex; padding: 16px 0; }
  .stats div { flex: 1; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .stats div + div { border-right: 1px solid var(--sep); }
  .stats b { font-size: 22px; font-weight: 600; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--sec); padding: 0 0 14px; }
  .legend span { display: flex; align-items: center; gap: 5px; }

  .mbar { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 14px; padding: 6px; }
  .mbtn { width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--acc); display: flex; align-items: center; justify-content: center; }
  .mbtn:disabled { color: var(--sep); }
  .search { display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 12px; background: var(--fill); padding: 0 12px; color: var(--sec); }
  .search input { flex: 1; border: 0; outline: 0; background: none; font-size: 16px; color: var(--tx); }
  .bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--g); border-radius: 3px; }
  .req { background: var(--ab); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .req .acts { display: flex; gap: 10px; }
  .req .acts button { flex: 1; height: 40px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; }
  .empty { text-align: center; color: var(--sec); font-size: 14px; padding: 28px 20px; }
  .total { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .total .num { font-size: 26px; font-weight: 700; }
  .amt { border: 0; outline: 0; background: none; width: 100%; text-align: center; font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .feat { display: flex; gap: 16px; align-items: flex-start; }
  .feat i { width: 44px; height: 44px; border-radius: 22px; background: var(--tint); color: var(--acc); display: flex; align-items: center; justify-content: center; flex: none; }
  .feat b { display: block; font-size: 17px; font-weight: 600; }
  .feat span { display: block; font-size: 15px; color: var(--sec); margin-top: 2px; }
  .face { width: 120px; height: 120px; border-radius: 32px; background: var(--tint); color: var(--acc); display: flex; align-items: center; justify-content: center; align-self: center; }
  .face.scan { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.94); opacity: .7; } }
  .nav { border: 0; background: none; font-size: 17px; color: var(--acc); padding: 6px 0; display: flex; align-items: center; gap: 4px; }
  .nav.b { font-weight: 600; }
  .demo { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .demo button { border: 1px solid var(--sep); background: var(--card); border-radius: 10px; padding: 6px 12px; font-size: 13px; }

  .tabs { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--sep); display: flex; padding: 6px 12px env(safe-area-inset-bottom); min-height: 84px; z-index: 5; }
  .tabs[hidden] { display: none; }
  .tab { flex: 1; border: 0; background: none; font-size: 10px; font-weight: 500; color: var(--sec); display: flex; flex-direction: column; align-items: center; gap: 4px; height: 48px; justify-content: center; }
  .tab.on { color: var(--acc); }

  #sheet { position: absolute; inset: 0; z-index: 20; display: none; }
  #sheet.show { display: block; }
  #sheet .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); animation: fade .2s; }
  #sheet .box { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 24px 24px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; animation: up .25s ease-out; max-height: 90%; overflow-y: auto; }
  #sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--sep); align-self: center; }
  @keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(100%); } }
  #toast { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -120%); background: var(--tx); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-size: 14px; font-weight: 500; z-index: 30; transition: transform .25s; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="phone">
  <main id="scr"></main>
  <nav id="tabs" class="tabs" aria-label="التبويبات" hidden></nav>
  <div id="sheet"><div class="scrim" data-act="close"></div><div class="box" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
// Grdlabs Mobile UI: clickable prototype of the phone app with demo data. Sign in as an employee or as the company owner.
// Everything runs in this page; state is kept in localStorage so a refresh keeps where you were.
(() => {
  'use strict';
  const KEY = 'grdlabs-mobile-ui-v1';
  const $ = (s) => document.querySelector(s);
  const scr = $('#scr'), tabs = $('#tabs'), sheet = $('#sheet'), box = sheet.querySelector('.box'), toastEl = $('#toast');
  const nf = new Intl.NumberFormat('en-US');
  const money = (n) => nf.format(Math.round(n || 0));
  const ar = (n) => Number(n).toLocaleString('ar-IQ', { useGrouping: false });
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
  const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const now = () => new Date();
  const clock = (d) => { const h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0'); return ar(h % 12 || 12) + ':' + m.replace(/\d/g, (x) => ar(x)) + (h < 12 ? ' ص' : ' م'); };
  const todayKey = () => now().toDateString();

  // ---------- icons (from the design) ----------
  const I = {
    logo: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="18" rx="3"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>',
    face: (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8V6A2.5 2.5 0 0 1 6 3.5h2M16 3.5h2A2.5 2.5 0 0 1 20.5 6v2M20.5 16v2a2.5 2.5 0 0 1-2.5 2.5h-2M8 20.5H6A2.5 2.5 0 0 1 3.5 18v-2"/><path d="M8.5 9v1.5M15.5 9v1.5M12 9v4h-1M9 15.5c1.7 1.4 4.3 1.4 6 0"/></svg>`,
    bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>',
    chev: '<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 1 1 7l6 6"/></svg>',
    back: '<svg width="10" height="17" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>',
    next: '<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 1 1 7l6 6"/></svg>',
    close: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1 1l10 10M11 1 1 11"/></svg>',
    plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    cam: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    down: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
    user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    home: '<svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1v-9.6z"/></svg>',
    time: '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    cash: '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
    me: '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    doc: '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h4"/></svg>',
    team: '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>',
    newInv: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M12 9v6"/></svg>',
    newExp: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 9v6M9 12h6"/></svg>',
    moon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  };

  // ---------- demo data ----------
  const fresh = () => ({
    user: null, seenFace: false, seenNews: false, faceOn: false, notif: true, theme: 'auto',
    clockIn: null, clockOut: null, day: todayKey(), hidden: {}, salMonth: 0, invFilter: 'all',
    advance: { name: 'أحمد', amount: 200000, status: 'pending' },
    staff: [
      { n: 'أحمد علي', r: 'محاسب', s: 'p', at: '7:55' }, { n: 'علي حسن', r: 'مبيعات', s: 'p', at: '7:58' },
      { n: 'سارة كريم', r: 'مبيعات', s: 'l', at: '8:24' }, { n: 'مصطفى جاسم', r: 'مخزن', s: 'x' },

      const s = S.staff[Number(el.dataset.k)]; if (!s) return;
      openSheet(`<div style="display:flex;align-items:center;gap:14px"><span class="av" style="width:52px;height:52px;border-radius:26px;font-size:20px">${esc(s.n[0])}</span><div><h2>${esc(s.n)}</h2><span class="lbl">${esc(s.r)}</span></div></div>
        <div class="card"><div class="row"><span class="t">الراتب الأساسي</span><span class="v">1,200,000</span></div><div class="row"><span class="t">حضور هذا الشهر</span><span class="v">١٨ يوم</span></div><div class="row"><span class="t">السلف</span><span class="v">150,000</span></div></div>
        <div style="display:flex;gap:10px"><button type="button" class="btn2" data-act="bonus" data-k="${el.dataset.k}" data-v="b">مكافأة</button><button type="button" class="btn2" data-act="bonus" data-k="${el.dataset.k}" data-v="d" style="color:var(--r)">خصم</button></div>`);
    },
    bonus: (el) => { const s = S.staff[Number(el.dataset.k)]; closeSheet(); toast((el.dataset.v === 'b' ? 'انضافت مكافأة لـ ' : 'انضاف خصم على ') + s.n); },
    addStaff: () => openSheet(`<h2>موظف جديد</h2><div class="fld"><label for="sN">الاسم</label><input id="sN" placeholder="الاسم الكامل"></div><div class="fld"><label for="sR">الوظيفة</label><input id="sR" placeholder="مثلاً: كاشير"></div><button type="button" class="btn" data-act="staffSave">أضف وأعطيه رمز الربط</button>`),
    staffSave: () => {
      const n = $('#sN').value.trim(), r = $('#sR').value.trim() || 'موظف';
      if (!n) return toast('اكتب الاسم');
      S.staff.push({ n, r, s: 'x' }); save(); render();
      openSheet(`<h2>انضاف ${esc(n)}</h2><p class="lbl">خلّيه ينزّل التطبيق ويكتب هذا الرمز:</p><div class="card" style="padding:22px;text-align:center;font-size:34px;font-weight:700;letter-spacing:8px" dir="ltr">482 913</div><button type="button" class="btn2" data-act="close">تمام</button>`);
    },
  };
  const readExp = () => {
    if (!exp) return;
    const a = $('#amt'), f = $('#from'), n = $('#note');
    if (a) exp.amt = Number(a.value.replace(/\D/g, '')); if (f) exp.from = f.value; if (n) exp.note = n.value.trim();
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'loginForm') return;
    e.preventDefault();
    const em = $('#em').value.trim().toLowerCase(), pw = $('#pw').value;
    if (!/^\S+@\S+\.\S+$/.test(em)) return toast('اكتب إيميل صحيح');
    if (pw.length < 4) return toast('اكتب كلمة المرور');
    signIn(em, /^(owner|admin|boss)/.test(em) ? 'owner' : 'employee');
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'invQ') { S.invQ = t.value; const pos = t.selectionStart; render(); const n = $('#invQ'); n.focus(); n.setSelectionRange(pos, pos); }
    if (t.id === 'amt' || t.id === 'advIn' || t.id === 'itP' || t.id === 'itQ') { const d = t.value.replace(/\D/g, ''); t.value = d ? nf.format(Number(d)) : ''; }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'cust' && draft) draft.c = t.value;
    if (t.id === 'itN') $('#itP').value = money(t.value);
    if (t.id === 'photo' && exp && t.files.length) { readExp(); exp.photo = true; render(); toast('تم إرفاق صورة الوصل'); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

  applyTheme();
  route = S.user ? homeOf() : 'login';
  render(true);
})();
</script>
</body>
</html>
