<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E9EDF5">
<title>Grdlabs Mobile</title>
<link rel="icon" href="../img/grdlabs-app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap">
<style id="pageCss">@page { size: 80mm auto; margin: 0; }</style>
<style>
  /* Grdlabs Mobile: phone app UI prototype in the iOS "Liquid Glass" style.
     Login, employee account, company (owner) account, Apple-style notifications, and printable
     invoices, receipt vouchers, payment vouchers, salary slips and a daily report (80mm thermal or A4). */
  :root {
    color-scheme: light;
    --wall: #E9EDF5;
    --b1: rgba(0,122,255,.30); --b2: rgba(175,82,222,.24); --b3: rgba(48,176,199,.26); --b4: rgba(255,149,0,.20);
    --glass: rgba(255,255,255,.50); --glass2: rgba(255,255,255,.68); --glass3: rgba(250,250,252,.80);
    --stroke: rgba(255,255,255,.80); --hi: rgba(255,255,255,.70); --shadow: 0 10px 34px -14px rgba(30,40,80,.28);
    --tx: #0B0B0F; --sec: rgba(60,60,67,.64); --ter: rgba(60,60,67,.34); --sep: rgba(60,60,67,.16); --fill: rgba(120,120,128,.14); --fill2: rgba(120,120,128,.22);
    --acc: #007AFF; --onacc: #FFFFFF; --g: #34C759; --gt: #248A3D; --r: #FF3B30; --o: #FF9500; --ot: #C56A00; --p: #AF52DE; --t: #30B0C7; --i: #5856D6; --y: #FFCC00;
    --scrim: rgba(0,0,0,.22); --nc: rgba(20,24,36,.34);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --wall: #07080C;
      --b1: rgba(10,132,255,.34); --b2: rgba(191,90,242,.26); --b3: rgba(64,200,224,.20); --b4: rgba(255,159,10,.16);
      --glass: rgba(44,44,52,.42); --glass2: rgba(34,34,40,.62); --glass3: rgba(40,40,46,.78);
      --stroke: rgba(255,255,255,.13); --hi: rgba(255,255,255,.10); --shadow: 0 10px 34px -14px rgba(0,0,0,.7);
      --tx: #F5F5F7; --sec: rgba(235,235,245,.62); --ter: rgba(235,235,245,.30); --sep: rgba(84,84,88,.50); --fill: rgba(120,120,128,.24); --fill2: rgba(120,120,128,.34);
      --acc: #0A84FF; --onacc: #FFFFFF; --g: #30D158; --gt: #30D158; --r: #FF453A; --o: #FF9F0A; --ot: #FF9F0A; --p: #BF5AF2; --t: #40C8E0; --i: #5E5CE6; --y: #FFD60A;
      --scrim: rgba(0,0,0,.45); --nc: rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --wall: #07080C;
    --b1: rgba(10,132,255,.34); --b2: rgba(191,90,242,.26); --b3: rgba(64,200,224,.20); --b4: rgba(255,159,10,.16);
    --glass: rgba(44,44,52,.42); --glass2: rgba(34,34,40,.62); --glass3: rgba(40,40,46,.78);
    --stroke: rgba(255,255,255,.13); --hi: rgba(255,255,255,.10); --shadow: 0 10px 34px -14px rgba(0,0,0,.7);
    --tx: #F5F5F7; --sec: rgba(235,235,245,.62); --ter: rgba(235,235,245,.30); --sep: rgba(84,84,88,.50); --fill: rgba(120,120,128,.24); --fill2: rgba(120,120,128,.34);
    --acc: #0A84FF; --onacc: #FFFFFF; --g: #30D158; --gt: #30D158; --r: #FF453A; --o: #FF9F0A; --ot: #FF9F0A; --p: #BF5AF2; --t: #40C8E0; --i: #5E5CE6; --y: #FFD60A;
    --scrim: rgba(0,0,0,.45); --nc: rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--wall); color: var(--tx); font-family: -apple-system, 'SF Pro Text', 'SF Arabic', 'Noto Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--acc); text-decoration: none; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- device ---------- */
  #phone { --top: max(env(safe-area-inset-top), 14px); --bot: env(safe-area-inset-bottom); position: relative; width: 100%; height: 100dvh; overflow: hidden; overflow: clip; background: var(--wall); isolation: isolate; }
  .wall { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .wall::before { content: ""; position: absolute; inset: -10%; background:
      radial-gradient(42% 30% at 82% 8%, var(--b1), transparent 70%),
      radial-gradient(40% 28% at 8% 32%, var(--b2), transparent 70%),
      radial-gradient(46% 30% at 86% 64%, var(--b3), transparent 70%),
      radial-gradient(40% 26% at 14% 92%, var(--b4), transparent 70%), var(--wall);
    animation: drift 30s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(-3%, 2%, 0) scale(1.04); } }
  #sb, .island, .homebar { display: none; }
  @media (min-width: 600px) and (min-height: 760px) {
    body { display: grid; place-items: center; background: radial-gradient(80% 60% at 50% 40%, #2A2F3A, #0E1015); }
    #phone { --top: 54px; --bot: 20px; width: 390px; height: min(844px, calc(100dvh - 40px)); border-radius: 54px; box-shadow: 0 0 0 11px #1A1A1C, 0 0 0 12px #3A3A3E, 0 40px 90px -20px rgba(0,0,0,.7); }
    #sb { display: flex; }
    .island { display: block; position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 18px; background: #000; z-index: 60; }
    .homebar { display: block; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: var(--tx); opacity: .85; z-index: 60; pointer-events: none; }
  }
  #sb { position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 18px 34px 0; align-items: center; justify-content: space-between; z-index: 55; font-size: 16px; font-weight: 600; pointer-events: none; direction: ltr; }
  #sb .ic { display: flex; gap: 6px; align-items: center; }
  #sb .tm { padding-left: 14px; }

  /* ---------- glass material ---------- */
  .glass, .list, .card, .tabs, .nb, .seg, .sheet .box, .ban, .alert, .menu, .hud, .search, .chip, .stp, .fab { -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%); }
  .glass, .list, .card { background: var(--glass); border: .5px solid var(--stroke); box-shadow: inset 0 1px 0 var(--hi), var(--shadow); }

  /* ---------- screen + nav ---------- */
  #scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: calc(var(--top) + 52px) 16px calc(var(--bot) + 112px); display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
  #scr::-webkit-scrollbar { display: none; }
  #scr.notabs { padding-bottom: calc(var(--bot) + 40px); }
  #scr.bare { padding-top: calc(var(--top) + 20px); }
  #scr.anim > * { animation: in .34s cubic-bezier(.2,.8,.2,1) both; }
  #scr.anim > *:nth-child(2) { animation-delay: .03s; } #scr.anim > *:nth-child(3) { animation-delay: .06s; } #scr.anim > *:nth-child(4) { animation-delay: .09s; } #scr.anim > *:nth-child(n+5) { animation-delay: .12s; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  #nav { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: var(--top) 12px 0; height: calc(var(--top) + 52px); display: flex; align-items: center; gap: 8px; pointer-events: none; transition: background .25s; }
  #nav::before { content: ""; position: absolute; inset: 0; -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); background: linear-gradient(var(--glass2), transparent); -webkit-mask: linear-gradient(#000 60%, transparent); mask: linear-gradient(#000 60%, transparent); opacity: 0; transition: opacity .25s; z-index: -1; }
  #nav.solid::before { opacity: 1; }
  #nav > * { pointer-events: auto; }
  #nav .nt { position: absolute; left: 70px; right: 70px; text-align: center; font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nav.solid .nt { opacity: 1; }
  #nav .grow { flex: 1; }
  .nb { height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: .5px solid var(--stroke); background: var(--glass2); box-shadow: inset 0 1px 0 var(--hi), 0 4px 16px -8px rgba(0,0,0,.25); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 500; position: relative; flex: none; transition: transform .15s; }
  .nb.ic { padding: 0; width: 44px; }
  .nb.acc { background: var(--acc); color: #fff; border-color: transparent; }
  .nb:active, .btn:active, .act:active, .tap:active { transform: scale(.96); }
  .nb .bdg { position: absolute; top: -2px; left: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--r); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; border: 2px solid var(--wall); }
  .lt { font-size: 34px; font-weight: 800; letter-spacing: -.2px; margin: 2px 4px -4px; line-height: 1.25; }
  .ls { margin: -10px 4px 0; font-size: 15px; color: var(--sec); display: flex; align-items: center; gap: 6px; }

  /* ---------- type + bits ---------- */
  h2 { margin: 0; font-size: 20px; font-weight: 700; } h3 { margin: 0; font-size: 17px; font-weight: 600; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .lbl { font-size: 13px; color: var(--sec); }
  .hd { font-size: 13px; color: var(--sec); margin: 6px 0 -8px; padding: 0 18px; font-weight: 500; }
  .ft { font-size: 13px; color: var(--sec); margin: -8px 0 0; padding: 0 18px; line-height: 1.5; }
  .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--g); display: inline-block; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--g) 22%, transparent); }
  .pill { font-size: 12px; font-weight: 600; border-radius: 10px; padding: 3px 9px; white-space: nowrap; }
  .pg { color: var(--gt); background: color-mix(in srgb, var(--g) 16%, transparent); } .po { color: var(--ot); background: color-mix(in srgb, var(--o) 16%, transparent); }
  .pr { color: var(--r); background: color-mix(in srgb, var(--r) 14%, transparent); } .pb { color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, transparent); }
  .card { border-radius: 26px; padding: 20px; }
  .big { font-size: 36px; font-weight: 800; letter-spacing: -.5px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .cur { font-size: 15px; color: var(--sec); font-weight: 500; }

  .btn { height: 52px; border: 0; border-radius: 26px; background: var(--acc); color: var(--onacc); font-size: 17px; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; flex: none; transition: transform .15s, opacity .15s; box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--acc) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.gl { background: var(--glass2); color: var(--acc); border: .5px solid var(--stroke); box-shadow: inset 0 1px 0 var(--hi), var(--shadow); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
  .btn.red { color: var(--r); }
  .btn.sm { height: 44px; font-size: 15px; border-radius: 22px; }
  .btn:disabled { opacity: .4; }
  .ghost { height: 46px; border: 0; background: none; font-size: 17px; color: var(--acc); width: 100%; }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; min-width: 0; }

  /* ---------- inset grouped lists ---------- */
  .list { border-radius: 26px; overflow: hidden; flex: none; }
  .r { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 18px; position: relative; width: 100%; border: 0; background: none; text-align: start; color: var(--tx); font-size: 16px; }
  .r + .r::before { content: ""; position: absolute; top: 0; left: 0; right: 18px; height: .5px; background: var(--sep); }
  .r.ind + .r.ind::before, .r.ind + .r::before { right: 60px; }
  button.r:active, a.r:active, label.r:active { background: var(--fill); }
  .r .t { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .r .t > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .s { font-size: 13px; color: var(--sec); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .v { color: var(--sec); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .r .vb { color: var(--tx); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .r .end { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .r input, .r select, .r textarea { border: 0; outline: 0; background: none; font-size: 16px; text-align: left; color: var(--sec); min-width: 0; flex: 1; }
  .r select { appearance: none; -webkit-appearance: none; direction: rtl; flex: none; cursor: pointer; }
  .r.red { color: var(--r); justify-content: center; font-weight: 500; }
  .r.blue { color: var(--acc); }
  .chev { color: var(--ter); flex: none; }
  .sq { width: 30px; height: 30px; border-radius: 8px; color: #fff; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .av { width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(160deg, color-mix(in srgb, var(--acc) 30%, transparent), color-mix(in srgb, var(--p) 22%, transparent)); color: var(--acc); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; border: .5px solid var(--stroke); }
  .av.lg { width: 64px; height: 64px; border-radius: 32px; font-size: 26px; }

  /* ---------- controls ---------- */
  .seg { display: flex; background: var(--fill); border-radius: 22px; padding: 3px; gap: 2px; flex: none; border: .5px solid var(--stroke); }
  .seg button { flex: 1; height: 34px; border: 0; border-radius: 19px; background: none; font-size: 14px; font-weight: 500; transition: background .2s, box-shadow .2s; white-space: nowrap; }
  .seg button.on { background: var(--glass3); box-shadow: 0 2px 8px -2px rgba(0,0,0,.18), inset 0 1px 0 var(--hi); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 36px; padding: 0 16px; border-radius: 18px; border: .5px solid var(--stroke); background: var(--glass); font-size: 14px; font-weight: 500; box-shadow: inset 0 1px 0 var(--hi); }
  .chip.on { background: var(--acc); color: #fff; border-color: transparent; }
  .sw { width: 51px; height: 31px; border-radius: 16px; border: 0; background: var(--fill2); position: relative; flex: none; transition: background .25s; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: right .25s cubic-bezier(.3,1.4,.5,1); }
  .sw.on { background: var(--g); } .sw.on::after { right: 22px; }
  .stp { display: flex; align-items: center; background: var(--fill); border-radius: 16px; height: 32px; flex: none; border: .5px solid var(--stroke); }
  .stp button { width: 36px; height: 32px; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--tx); }
  .stp span { min-width: 30px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; border-inline: .5px solid var(--sep); }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; border-radius: 22px; background: var(--glass); border: .5px solid var(--stroke); padding: 0 14px; color: var(--sec); flex: none; box-shadow: inset 0 1px 0 var(--hi); }
  .search input { flex: 1; border: 0; outline: 0; background: none; font-size: 16px; color: var(--tx); min-width: 0; }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld label { font-size: 13px; color: var(--sec); padding: 0 6px; }
  .fld input { height: 52px; border: .5px solid var(--stroke); outline: 0; border-radius: 26px; background: var(--glass); padding: 0 20px; font-size: 16px; width: 100%; box-shadow: inset 0 1px 0 var(--hi); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
  .fld input:focus { box-shadow: 0 0 0 2px var(--acc); }
  .bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--g); transition: width .4s; }

  /* ---------- widgets ---------- */
  .mini { flex: 1; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 4px; color: var(--tx); min-width: 0; }
  .mini b { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .act { border: .5px solid var(--stroke); background: var(--glass); border-radius: 22px; height: 82px; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 1px 0 var(--hi), var(--shadow); -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%); transition: transform .15s; }
  .act .sq { width: 36px; height: 36px; border-radius: 11px; }
  .spark { display: flex; align-items: flex-end; gap: 7px; height: 64px; margin-top: 16px; }
  .spark div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .spark i { width: 100%; border-radius: 6px; background: color-mix(in srgb, var(--acc) 28%, transparent); min-height: 4px; }
  .spark div.on i { background: var(--acc); }
  .spark span { font-size: 10px; color: var(--sec); }
  .tip { border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: linear-gradient(120deg, color-mix(in srgb, var(--acc) 16%, var(--glass)), var(--glass)); border: .5px solid var(--stroke); box-shadow: inset 0 1px 0 var(--hi); -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); }
  .tip .k { font-size: 12px; font-weight: 700; color: var(--acc); }
  .tip .m { font-size: 15px; font-weight: 500; margin-top: 2px; }
  .x { border: 0; background: var(--fill); color: var(--sec); width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex: none; padding: 0; }
  .req { border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(120deg, color-mix(in srgb, var(--o) 18%, var(--glass)), var(--glass)); border: .5px solid var(--stroke); -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); }
  .empty { text-align: center; color: var(--sec); font-size: 15px; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .week { display: flex; justify-content: space-between; }
  .week div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--sec); }
  .week i { width: 30px; height: 30px; border-radius: 15px; background: var(--fill); display: flex; align-items: center; justify-content: center; font-style: normal; color: #fff; }
  .week i.p { background: var(--g); } .week i.l { background: var(--o); } .week i.x { background: var(--r); } .week i.t { background: none; border: 2px dashed var(--acc); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center; }
  .wd { font-size: 11px; color: var(--sec); padding-bottom: 6px; font-weight: 600; }
  .d { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-variant-numeric: tabular-nums; position: relative; }
  .d::after { content: ""; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 3px; }
  .d.p::after { background: var(--g); } .d.l::after { background: var(--o); } .d.x::after { background: var(--r); }
  .d.o, .d.f { color: var(--ter); }
  .d.t span { width: 36px; height: 36px; border-radius: 18px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .stats { display: flex; padding: 16px 0; }
  .stats div { flex: 1; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .stats div + div { border-right: .5px solid var(--sep); }
  .stats b { font-size: 24px; font-weight: 700; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--sec); padding-top: 10px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend .dot { box-shadow: none; }
  .amt { border: 0; outline: 0; background: none; width: 100%; text-align: center; font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .words { font-size: 13px; color: var(--sec); text-align: center; line-height: 1.6; min-height: 21px; }
  .feat { display: flex; gap: 16px; align-items: flex-start; }
  .feat .sq { width: 46px; height: 46px; border-radius: 13px; }
  .feat b { display: block; font-size: 17px; font-weight: 600; }
  .feat span { display: block; font-size: 15px; color: var(--sec); margin-top: 2px; line-height: 1.5; }
  .face { width: 128px; height: 128px; border-radius: 36px; display: flex; align-items: center; justify-content: center; align-self: center; color: var(--acc); }
  .face.scan svg { animation: scan 1.1s ease-in-out infinite; }
  @keyframes scan { 50% { transform: scale(.9); opacity: .6; } }

    custAdd: (el) => { const n = $('#ncN').value.trim(); if (!n) return openAlert('اكتب اسم الزبون', '', [{ t: 'حسناً', cls: 'pri' }]); S.customers.unshift({ n, ph: $('#ncP').value.trim() }); save(); const o = el.dataset.for === 'rc' ? rc : draft; o.c = n; if (o === rc) rc.inv = 0; closeAll(); hud('انضاف الزبون'); render(); },
    addItem: () => { if (route !== 'c-new') return; openSheet(`${sheetHead('أضف مادة', 'close')}<label class="search">${I.search}<input id="pq" placeholder="ابحث عن مادة" data-nofocus="1"></label>
      <div class="list" id="prodList">${PRODUCTS.map(([n, p], k) => { const inD = draft.items.find((x) => x.n === n); return `<button type="button" class="r" data-act="prodAdd" data-k="${k}"><span class="sq" style="background:var(--fill);color:var(--acc)">${I.tag()}</span><span class="t"><span>${n}</span><span class="s">${money(p)} د.ع</span></span>${inD ? `<span class="pill pb">× ${nf.format(inD.q)}</span>` : `<span style="color:var(--acc)">${I.plus}</span>`}</button>`; }).join('')}</div>`, false); },
    prodAdd: (el) => { const [n, p] = PRODUCTS[Number(el.dataset.k)]; const f = draft.items.find((x) => x.n === n); f ? f.q++ : draft.items.push({ n, p, q: 1 }); haptic(); const r = el.querySelector('.pill, span:last-child'); r.outerHTML = `<span class="pill pb">× ${nf.format((f || draft.items[draft.items.length - 1]).q)}</span>`; render(); },
    qty: (el) => { const x = draft.items[Number(el.dataset.k)]; x.q = Math.max(1, x.q + Number(el.dataset.d)); haptic(); render(); },
    rmItem: (el) => { draft.items.splice(Number(el.dataset.k), 1); haptic(); render(); },
    saveInv: () => {
      if (!draft.items.length) return openAlert('الفاتورة فارغة', 'أضف مادة وحدة على الأقل.', [{ t: 'حسناً', cls: 'pri' }]);
      const inv = { no: draft.no, c: draft.c, date: new Date().toISOString(), items: draft.items, disc: draft.disc || 0, pay: draft.pay === 'جزئي' ? 'نقد (جزئي)' : draft.pay, note: draft.note || '' };
      const t = total(inv); inv.paid = draft.pay === 'آجل' ? 0 : draft.pay === 'جزئي' ? Math.min(t, draft.paid || 0) : t;
      S.invoices.unshift(inv); save(); draft = null; S.cur = inv.no; prev = ['c-inv']; route = 'c-invd'; render(true); hud('انحفظت الفاتورة');
      setTimeout(() => openMenu([{ t: 'اطبع الفاتورة', i: I.print, f: () => openDoc('inv', inv.no) }, { t: 'شارك بالواتساب', i: I.wa, f: () => { docCur = { kind: 'inv', id: inv.no }; doShare(); } }], `فاتورة #${inv.no} · ${money(t)} د.ع`), 900);
    },
    invMore: () => { const i = invBy(S.cur); openMenu([
      { t: 'طباعة', i: I.print, f: () => openDoc('inv', i.no) }, { t: 'مشاركة PDF', i: I.share, f: () => { docCur = { kind: 'inv', id: i.no }; doShare(); } },
      ...(due(i) ? [{ t: 'سند قبض', i: I.in(21), f: () => A.newRcpt({ dataset: { no: i.no } }) }] : []), { t: 'تكرار الفاتورة', i: I.copy, f: () => A.dupInv({ dataset: { id: i.no } }) },
      ...((S.customers.find((c) => c.n === i.c) || {}).ph ? [{ t: 'اتصل بالزبون', i: I.phone, f: () => hud('جاري الاتصال', rs(I.phone, 48)) }] : []),
      { t: 'حذف الفاتورة', i: I.trash, des: true, f: () => openAlert(`حذف الفاتورة #${i.no}؟`, 'ما تگدر ترجعها بعد الحذف.', [{ t: 'إلغاء' }, { t: 'حذف', cls: 'des', f: () => { S.invoices = S.invoices.filter((x) => x.no !== i.no); save(); prev = []; go('c-inv', false); hud('انحذفت', rs(I.trash, 48)); } }]) },
    ], `${esc(i.c)} · #${i.no}`); },
    shareInv: (el) => { docCur = { kind: 'inv', id: Number(el.dataset.id) }; doShare(); },
    shareTip: () => openAlert('شارك الفاتورة', 'افتح أي فاتورة واضغط "واتساب"، أو من الطباعة اختار "مشاركة".', [{ t: 'تمام', cls: 'pri' }]),
    doc: (el) => openDoc(el.dataset.k, Number(el.dataset.id) || 0),
    print: doPrint, share: doShare,

    // receipts + debts
    debts: () => { const d = S.invoices.filter((i) => due(i) > 0); openSheet(`${sheetHead('ديون الزباين')}<div class="card" style="text-align:center;padding:16px"><div class="lbl">المجموع</div><div class="big" style="font-size:30px;color:var(--ot)">${money(debtTotal())}</div></div>
      ${d.length ? `<div class="list">${d.map((i) => `<div class="r"><span class="t"><span>${esc(i.c)}</span><span class="s">#${i.no} · ${dayLabel(i.date)} · ${ST[status(i)][0]}</span></span><span class="vb">${money(due(i))}</span><button type="button" class="btn sm" style="width:auto;padding:0 14px;height:34px" data-act="newRcpt" data-no="${i.no}">قبض</button></div>`).join('')}</div>` : '<div class="list empty">ماكو ديون ✓</div>'}`, false); },
    newRcpt: (el) => { const i = el && el.dataset && el.dataset.no ? invBy(el.dataset.no) : S.invoices.find((x) => due(x) > 0); rc = { c: i ? i.c : S.customers[0].n, inv: i ? i.no : 0, amt: i ? due(i) : 0, method: 'نقد', note: '' }; go('c-rcpt'); },
    rcInv: (el) => { rc.inv = Number(el.dataset.no); const i = invBy(rc.inv); if (i) rc.amt = due(i); haptic(); render(); },
    saveRcpt: () => {
      if (!rc.amt) return openAlert('اكتب المبلغ', '', [{ t: 'حسناً', cls: 'pri' }]);
      const i = rc.inv && invBy(rc.inv);
      if (i && rc.amt > due(i)) return openAlert('المبلغ أكبر من المتبقي', `المتبقي على الفاتورة #${i.no} هو ${money(due(i))} د.ع.`, [{ t: 'حسناً', cls: 'pri' }]);
      const r = { no: nextNo(S.receipts, 500), c: rc.c, amt: rc.amt, inv: rc.inv || 0, method: rc.method, note: rc.note, date: new Date().toISOString() };
      if (i) i.paid = (i.paid || 0) + r.amt;
      S.receipts.unshift(r); save(); rc = null; S.finTab = 'rcpt'; prev = ['c-fin']; route = 'c-fin'; render(true); hud('انحفظ السند');
      setTimeout(() => openMenu([{ t: 'اطبع سند القبض', i: I.print, f: () => openDoc('rcpt', r.no) }, { t: 'شارك', i: I.share, f: () => { docCur = { kind: 'rcpt', id: r.no }; doShare(); } }], `سند قبض #${r.no} · ${money(r.amt)} د.ع`), 900);
    },
    finNew: () => openMenu([{ t: 'مصروف جديد', i: I.out(21), f: A.newExp }, { t: 'سند قبض جديد', i: I.in(21), f: A.newRcpt }, { t: 'تقرير اليوم', i: I.chart(21), f: () => openDoc('day', 0) }]),

    // expenses
    newExp: () => { exp = { amt: 0, cat: 'كهرباء', from: 'الصندوق', to: '', note: '', photo: false }; go('c-newexp'); setTimeout(() => $('#amt')?.focus(), 400); },
    saveExp: () => {
      if (!exp.amt) return openAlert('اكتب المبلغ', '', [{ t: 'حسناً', cls: 'pri' }]);
      const e = { no: nextNo(S.expenses, 300), cat: exp.cat, amt: exp.amt, from: exp.from, to: exp.to, note: exp.note, photo: exp.photo, date: new Date().toISOString() };
      S.expenses.unshift(e); save(); exp = null; S.finTab = 'exp'; prev = []; route = 'c-fin'; render(true); hud('انحفظ المصروف');
      setTimeout(() => openMenu([{ t: 'اطبع سند الصرف', i: I.print, f: () => openDoc('exp', e.no) }, { t: 'شارك', i: I.share, f: () => { docCur = { kind: 'exp', id: e.no }; doShare(); } }], `سند صرف #${e.no} · ${money(e.amt)} د.ع`), 900);
    },

    // staff
    adv: (el) => {
      const ok = el.dataset.v === 'ok', a = S.advance;
      const doIt = () => { a.status = ok ? 'ok' : 'no'; push('employee', ok ? 'وافقت الشركة على سلفتك' : 'طلب السلفة', ok ? `سلفة ${money(a.amount)} د.ع تنخصم من راتبك الجاي` : 'رفضت الشركة طلب السلفة', 'e-home', false); save(); render(); hud(ok ? 'تمت الموافقة' : 'انرفض الطلب', ok ? I.bigcheck : rs(I.close, 48)); };
      if (ok) openAlert(`الموافقة على سلفة ${money(a.amount)}؟`, `تنخصم من راتب ${esc(a.name)} الجاي.`, [{ t: 'إلغاء' }, { t: 'وافق', cls: 'pri', f: doIt }]); else doIt();
    },
    emp: (el) => { const k = Number(el.dataset.k), s = S.staff[k]; openSheet(`${sheetHead(esc(s.n))}<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="av lg">${esc(s.n[0])}</span><span class="lbl">${esc(s.r)}</span></div>
      <div class="list"><div class="r"><span class="t"><span>الراتب الأساسي</span></span><span class="v">${money(s.sal)}</span></div><div class="r"><span class="t"><span>اليوم</span></span><span class="v">${s.s === 'x' ? 'غائب' : 'دخل ' + ar(s.at) + ' ص'}</span></div><div class="r"><span class="t"><span>حضور هذا الشهر</span></span><span class="v">١٨ يوم</span></div></div>
      <div class="row2"><button type="button" class="btn gl" data-act="bonus" data-k="${k}" data-v="b">${I.gift(20)} مكافأة</button><button type="button" class="btn gl red" data-act="bonus" data-k="${k}" data-v="d">${I.minus(20)} خصم</button></div>`, false); },
    bonus: (el) => { const s = S.staff[Number(el.dataset.k)], b = el.dataset.v === 'b'; closeAll(); if (s.n === 'أحمد علي') push('employee', 'الراتب', b ? 'انضافت مكافأة لراتبك' : 'انضاف خصم على راتبك', 'e-sal', false); hud(b ? 'انضافت المكافأة' : 'انضاف الخصم'); },
    addStaff: () => openSheet(`${sheetHead('موظف جديد', 'staffSave')}<div class="fld"><label for="sN">الاسم</label><input id="sN" placeholder="الاسم الكامل"></div><div class="fld"><label for="sR">الوظيفة</label><input id="sR" placeholder="مثلاً: كاشير"></div><div class="fld"><label for="sS">الراتب</label><input id="sS" inputmode="numeric" dir="ltr" data-num placeholder="0"></div><button type="button" class="btn" data-act="staffSave">أضف وأعطيه رمز الربط</button>`),
    staffSave: () => {
      const n = $('#sN').value.trim(); if (!n) return openAlert('اكتب الاسم', '', [{ t: 'حسناً', cls: 'pri' }]);
      S.staff.push({ n, r: $('#sR').value.trim() || 'موظف', s: 'x', sal: digits($('#sS').value) }); save(); render(); A.code();
    },
  };

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const nb = e.target.closest('.ban[data-nc]'); if (nb) { openNote(Number(nb.dataset.nid)); return; }
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'loginForm') return; e.preventDefault();
    const em = $('#em').value.trim().toLowerCase(), pw = $('#pw').value;
    if (!/^\S+@\S+\.\S+$/.test(em)) return openAlert('الإيميل غير صحيح', 'اكتب إيميل مثل name@example.com', [{ t: 'حسناً', cls: 'pri' }]);
    if (pw.length < 4) return openAlert('اكتب كلمة المرور', '', [{ t: 'حسناً', cls: 'pri' }]);
    signIn(em, /^(owner|admin|boss)/.test(em) ? 'owner' : 'employee');
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.num !== undefined) { const d = digits(t.value); t.value = d ? nf.format(d) : ''; if (t.id === 'advIn') $('#advW').textContent = d ? dinarWords(d) : ''; }
    if (t.dataset.bind) {
      const [o, k] = t.dataset.bind.split('.'), obj = o === 'P' && k === 'footer' ? S.company : objOf(o);
      if (obj) { obj[k] = t.dataset.num !== undefined ? digits(t.value) : t.value; save(); }
      if (o === 'draft' && $('#tot')) $('#tot').innerHTML = totalsHTML();
      if (o === 'exp' && k === 'amt') $('#expW').textContent = exp.amt ? dinarWords(exp.amt) : '';
      if (o === 'rc' && k === 'amt') $('#rcW').textContent = rc.amt ? dinarWords(rc.amt) : '';
    }
    if (t.id === 'invQ') { S.invQ = t.value; const pos = t.selectionStart; render(); const n = $('#invQ'); n.focus(); n.setSelectionRange(pos, pos); }
    if (t.id === 'cq' || t.id === 'pq') { const q = t.value.trim(); sheetBox.querySelectorAll(t.id === 'cq' ? '#custList .r' : '#prodList .r').forEach((r) => (r.hidden = q && !r.textContent.includes(q))); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.tagName === 'SELECT' && t.dataset.bind) { const [o, k] = t.dataset.bind.split('.'); objOf(o)[k] = t.value; save(); }
    if (t.id === 'photo' && exp && t.files.length) { exp.photo = true; render(); hud('انرفقت الصورة', rs(I.cam, 48)); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeAll(); closeNC(); } if (e.key === 'Enter' && e.target.classList?.contains('ban')) e.target.click(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  const tick = () => { const d = new Date(); $('#sbt').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tick(); setInterval(tick, 15000);

  applyTheme();
  route = S.user ? homeOf() : 'login';
  render(true);
  if (S.user) setTimeout(welcomeNotes, 1600);
})();
</script>
</body>
</html>
