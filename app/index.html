<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f7fb">
<title>Grdlabs · الموظف</title>
<link rel="icon" href="../img/grdlabs-app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f7fb; --surface: #fff; --ink: #0f1a2b; --muted: #5a6678; --line: #e3e8f0;
    --blue: #1570ef; --blue-soft: #e8f1fe; --green: #2f9e44; --green-soft: #e7f6ea; --red: #d92d20; --red-soft: #fdecea; --amber: #b54708; --amber-soft: #fff4e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.7 "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 520px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header img { width: 34px; height: 34px; }
  header b { font-size: 17px; }
  header span { color: var(--muted); font-size: 13px; display: block; line-height: 1.3; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(15,26,43,.04); }
  h1 { font-size: 22px; margin: 0 0 6px; line-height: 1.4; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  p { margin: 0 0 10px; color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 17px/1.2 inherit; cursor: pointer; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
  .btn:disabled { opacity: .55; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big { font-size: 30px; font-weight: 700; line-height: 1.3; }
  .muted { color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .lines { display: grid; gap: 8px; margin-top: 12px; }
  .lines div { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .lines div span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  .items li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  details { border-top: 1px solid var(--line); padding: 10px 0 0; margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  .msg { text-align: center; padding: 26px 18px; }
  .msg .ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; font-size: 30px; }
  .ic.ok { background: var(--green-soft); color: var(--green); }
  .ic.bad { background: var(--red-soft); color: var(--red); }
  .ic.wait { background: var(--blue-soft); color: var(--blue); }
  .spin { width: 26px; height: 26px; border: 3px solid var(--blue-soft); border-top-color: var(--blue); border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .days { display: grid; gap: 6px; margin-top: 8px; }
  .days div { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 6px; }
  .days div.head { color: var(--muted); border: 0; padding: 0; font-size: 13px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .fields { display: grid; gap: 12px; margin: 12px 0 14px; }
  .fields label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
  .inp { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 16px/1.3 inherit; text-align: left; }
  .inp:focus { outline: 2px solid var(--blue); outline-offset: 1px; background: var(--surface); }
  .err { color: var(--red); font-size: 14px; margin: 0; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(15,26,43,.45); display: flex; align-items: flex-end; justify-content: center; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .sheet-card { width: 100%; max-width: 460px; margin: 0; display: grid; gap: 12px; text-align: center; }
  .sheet-card h2 { margin: 0; }
  .sheet-card .ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; font-size: 30px; }
  .inp.code { text-align: center; font-size: 28px; letter-spacing: 10px; font-weight: 700; }
  .link:disabled { color: var(--muted); cursor: default; }
  .err:empty { display: none; }
  .ok { color: var(--green); font-size: 14px; margin: 12px 0 0; }
  .link { background: none; border: 0; padding: 0; color: var(--blue); font: 600 14px/1.6 inherit; cursor: pointer; }
  .card > .link { display: block; margin: 14px auto 0; }
  .seg { display: flex; gap: 6px; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 4px; overflow-x: auto; }
  .seg button { flex: 1; white-space: nowrap; border: 0; background: none; padding: 9px 10px; border-radius: 9px; font: 600 14px/1.2 inherit; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15,26,43,.12); }
  .hero { background: linear-gradient(135deg, #1570ef, #0b4fb3); color: #fff; border: 0; }
  .hero h1 { color: #fff; }
  .hero p { color: rgba(255,255,255,.85); margin: 0; }
  .note { background: var(--blue-soft); border-color: #cfe0fb; }
  .note p { margin: 4px 0 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .stats.three { grid-template-columns: 1fr 1fr 1fr; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat b { font-size: 15px; overflow-wrap: anywhere; }
  .stats.three .stat b { font-size: 13px; }
  .lines .total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
  .items li small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .fold details { border: 0; margin: 0; padding: 0; }
  .fold summary { padding: 0; }
  .fold .pill { margin-top: 10px; }
  body.has-tabs .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  #tabs { position: fixed; inset: auto 0 0 0; display: flex; justify-content: center; gap: 2px; background: rgba(255,255,255,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  #tabs[hidden] { display: none; }
  #tabs button { flex: 1; max-width: 104px; display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 6px 2px; border-radius: 12px; color: var(--muted); font: 600 11px/1.2 inherit; cursor: pointer; }
  #tabs button.on { color: var(--blue); background: var(--blue-soft); }
  #tabs svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../img/grdlabs-app-icon.svg" alt=""><div><b id="company">Grdlabs</b><span id="who">تطبيق الموظف</span></div></header>
  <main id="view"><div class="card msg"><div class="spin" style="margin:0 auto"></div></div></main>
</div>
<nav id="tabs" hidden aria-label="الأقسام"></nav>
<script src="../control/js/firebase-app-compat.js"></script>
<script src="../control/js/firebase-auth-compat.js"></script>
<script src="../control/js/firebase-firestore-compat.js"></script>
<script src="../control/js/config.js"></script>
<script src="app.js"></script>
</body>
</html>
